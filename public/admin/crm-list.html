<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacts List - CRM - VillageMembers Admin</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/typography.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/crm.css">

  <style>
    .admin-layout { display: flex; min-height: 100vh; }
    .admin-main { flex: 1; margin-left: var(--sidebar-width); background-color: var(--bg-secondary); }
    @media (max-width: 768px) { .admin-main { margin-left: 0; padding-bottom: 4rem; } }
  </style>
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar injected by navigation.js -->

    <!-- Main Content -->
    <main class="admin-main">
      <div class="crm-header">
        <div class="crm-header-title">
          Contacts List
        </div>
        <div class="crm-header-actions">
          <button onclick="window.location.href='/admin/crm-dashboard.html'" class="btn btn-ghost btn-sm">Dashboard</button>
          <button onclick="openAddContactModal()" class="btn btn-primary btn-sm">+ Add Contact</button>
        </div>
      </div>

      <div class="crm-content">
        <!-- Filters -->
        <div class="crm-filters">
          <div class="crm-filters-row">
            <div class="crm-search-box">
              <svg class="crm-search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
              </svg>
              <input type="text" id="search-input" placeholder="Search by name, email, company..." onkeyup="handleSearchChange()">
            </div>

            <select id="filter-type" class="crm-filter-select" onchange="handleFilterChange()">
              <option value="">All Types</option>
              <option value="prospect">Prospects</option>
              <option value="member">Members</option>
              <option value="alumni">Alumni</option>
            </select>

            <select id="filter-pipeline" class="crm-filter-select" onchange="handleFilterChange()">
              <option value="">All Pipelines</option>
            </select>

            <select id="filter-stage" class="crm-filter-select" onchange="handleFilterChange()">
              <option value="">All Stages</option>
            </select>

            <button class="btn btn-ghost btn-sm" onclick="clearFilters()">Clear Filters</button>
          </div>
        </div>

        <!-- Contacts Table -->
        <div class="crm-table-container">
          <div id="loading" class="crm-loading">Loading contacts...</div>
          <div id="table-wrapper" style="display: none;">
            <table class="crm-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Company</th>
                  <th>Type</th>
                  <th>Lead Score</th>
                  <th>Stage</th>
                  <th>Assigned</th>
                  <th>Source</th>
                  <th>Created</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="contacts-tbody">
              </tbody>
            </table>
          </div>
        </div>

        <!-- Pagination -->
        <div class="crm-pagination" id="pagination" style="display: none;">
          <button class="crm-pagination-btn" id="prev-btn" onclick="handlePrevPage()" disabled>Previous</button>
          <span id="page-info">Page 1 of 1</span>
          <button class="crm-pagination-btn" id="next-btn" onclick="handleNextPage()" disabled>Next</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Add Contact Modal -->
  <div id="add-contact-modal" class="crm-modal hidden">
    <div class="crm-modal-content">
      <div class="crm-modal-header">
        <h2 class="crm-modal-title">Add New Contact</h2>
        <button class="crm-modal-close" onclick="closeAddContactModal()">&times;</button>
      </div>
      <div class="crm-modal-body">
        <form id="add-contact-form">
          <div class="crm-form-group">
            <label class="crm-form-label">Email *</label>
            <input type="email" id="contact-email" class="crm-form-input" required>
          </div>
          <div class="crm-form-group">
            <label class="crm-form-label">First Name</label>
            <input type="text" id="contact-first-name" class="crm-form-input">
          </div>
          <div class="crm-form-group">
            <label class="crm-form-label">Last Name</label>
            <input type="text" id="contact-last-name" class="crm-form-input">
          </div>
          <div class="crm-form-group">
            <label class="crm-form-label">Company</label>
            <input type="text" id="contact-company" class="crm-form-input">
          </div>
          <div class="crm-form-group">
            <label class="crm-form-label">Phone</label>
            <input type="tel" id="contact-phone" class="crm-form-input">
          </div>
          <div class="crm-form-group">
            <label class="crm-form-label">Source</label>
            <select id="contact-source" class="crm-form-select">
              <option value="">Select source...</option>
              <option value="Website">Website</option>
              <option value="Referral">Referral</option>
              <option value="Event">Event</option>
              <option value="Social Media">Social Media</option>
              <option value="Import">Import</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </form>
      </div>
      <div class="crm-modal-footer">
        <button class="btn btn-ghost" onclick="closeAddContactModal()">Cancel</button>
        <button class="btn btn-primary" onclick="handleAddContact()">Add Contact</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/navigation.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/api.js"></script>
  <script>
    let currentUser = null;
    let currentPage = 1;
    let totalPages = 1;
    let searchTimeout = null;
    let pipelines = [];
    let stages = [];

    const filters = {
      search: '',
      type: '',
      pipeline_id: '',
      stage_id: ''
    };

    async function checkAuth() {
      try {
        const res = await fetch('/auth/me?type=user', { credentials: 'include' });
        if (!res.ok) { window.location.href = '/login.html'; return; }
        const data = await res.json();
        currentUser = data;
        await loadPipelines();
        await loadContacts();
      } catch (err) {
        window.location.href = '/login.html';
      }
    }

    async function loadPipelines() {
      try {
        const response = await fetch('/api/v1/crm/pipelines', { credentials: 'include' });
        if (!response.ok) return;
        const data = await response.json();
        pipelines = data.pipelines || [];

        const pipelineSelect = document.getElementById('filter-pipeline');
        pipelineSelect.innerHTML = '<option value="">All Pipelines</option>' +
          pipelines.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
      } catch (err) {
        console.error('Load pipelines error:', err);
      }
    }

    async function loadStages(pipelineId) {
      if (!pipelineId) {
        document.getElementById('filter-stage').innerHTML = '<option value="">All Stages</option>';
        stages = [];
        return;
      }

      try {
        const response = await fetch(`/api/v1/crm/pipelines/${pipelineId}`, { credentials: 'include' });
        if (!response.ok) return;
        const data = await response.json();
        stages = data.stages || [];

        const stageSelect = document.getElementById('filter-stage');
        stageSelect.innerHTML = '<option value="">All Stages</option>' +
          stages.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
      } catch (err) {
        console.error('Load stages error:', err);
      }
    }

    async function loadContacts() {
      try {
        const params = new URLSearchParams({
          page: currentPage,
          limit: 50,
          ...Object.fromEntries(Object.entries(filters).filter(([_, v]) => v))
        });

        const response = await fetch(`/api/v1/crm/contacts?${params}`, { credentials: 'include' });
        if (!response.ok) throw new Error('Failed to load contacts');
        const data = await response.json();
        const contacts = data.contacts || [];
        const pagination = data.pagination || {};

        document.getElementById('loading').style.display = 'none';
        document.getElementById('table-wrapper').style.display = 'block';
        document.getElementById('pagination').style.display = 'flex';

        const tbody = document.getElementById('contacts-tbody');

        if (contacts.length === 0) {
          tbody.innerHTML = '<tr><td colspan="10" class="crm-table-empty">No contacts found. Try adjusting your filters or add a new contact.</td></tr>';
        } else {
          tbody.innerHTML = contacts.map(contact => `
            <tr onclick="window.location.href='/admin/crm-contact.html?id=${contact.id}'" style="cursor: pointer;">
              <td><strong>${contact.first_name || ''} ${contact.last_name || ''}</strong></td>
              <td>${contact.email}</td>
              <td>${contact.company || '-'}</td>
              <td><span class="badge ${contact.type === 'prospect' ? 'badge-info' : contact.type === 'member' ? 'badge-success' : 'badge-gray'}">${contact.type}</span></td>
              <td><span class="badge ${contact.lead_score >= 70 ? 'badge-success' : contact.lead_score >= 40 ? 'badge-warning' : 'badge-gray'}">${contact.lead_score || 0}</span></td>
              <td>${contact.current_stage_name ? `<span style="color: ${contact.current_stage_color}">${contact.current_stage_name}</span>` : '-'}</td>
              <td>${contact.assigned_user_first_name ? `${contact.assigned_user_first_name} ${contact.assigned_user_last_name || ''}` : '-'}</td>
              <td>${contact.source || '-'}</td>
              <td>${new Date(contact.created_at).toLocaleDateString()}</td>
              <td>
                <button onclick="event.stopPropagation(); deleteContact('${contact.id}')" class="btn btn-ghost btn-sm" style="color: var(--error);">Delete</button>
              </td>
            </tr>
          `).join('');
        }

        // Update pagination
        currentPage = pagination.page || 1;
        totalPages = pagination.pages || 1;
        document.getElementById('page-info').textContent = `Page ${currentPage} of ${totalPages}`;
        document.getElementById('prev-btn').disabled = currentPage <= 1;
        document.getElementById('next-btn').disabled = currentPage >= totalPages;
      } catch (err) {
        console.error('Load contacts error:', err);
        document.getElementById('loading').textContent = 'Failed to load contacts';
      }
    }

    function handleSearchChange() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        filters.search = document.getElementById('search-input').value;
        currentPage = 1;
        loadContacts();
      }, 500);
    }

    async function handleFilterChange() {
      filters.type = document.getElementById('filter-type').value;
      filters.pipeline_id = document.getElementById('filter-pipeline').value;
      filters.stage_id = document.getElementById('filter-stage').value;

      if (filters.pipeline_id) {
        await loadStages(filters.pipeline_id);
      } else {
        document.getElementById('filter-stage').innerHTML = '<option value="">All Stages</option>';
      }

      currentPage = 1;
      loadContacts();
    }

    function clearFilters() {
      document.getElementById('search-input').value = '';
      document.getElementById('filter-type').value = '';
      document.getElementById('filter-pipeline').value = '';
      document.getElementById('filter-stage').value = '';
      filters.search = '';
      filters.type = '';
      filters.pipeline_id = '';
      filters.stage_id = '';
      currentPage = 1;
      loadContacts();
    }

    function handlePrevPage() {
      if (currentPage > 1) {
        currentPage--;
        loadContacts();
      }
    }

    function handleNextPage() {
      if (currentPage < totalPages) {
        currentPage++;
        loadContacts();
      }
    }

    async function deleteContact(id) {
      if (!confirm('Are you sure you want to delete this contact?')) return;

      try {
        const response = await fetch(`/api/v1/crm/contacts/${id}`, {
          method: 'DELETE',
          credentials: 'include'
        });

        if (!response.ok) throw new Error('Failed to delete contact');
        toast.success('Contact deleted successfully');
        loadContacts();
      } catch (err) {
        console.error('Delete contact error:', err);
        toast.error(err.message);
      }
    }

    function openAddContactModal() {
      document.getElementById('add-contact-modal').classList.remove('hidden');
    }

    function closeAddContactModal() {
      document.getElementById('add-contact-modal').classList.add('hidden');
      document.getElementById('add-contact-form').reset();
    }

    async function handleAddContact() {
      const email = document.getElementById('contact-email').value;
      const first_name = document.getElementById('contact-first-name').value;
      const last_name = document.getElementById('contact-last-name').value;
      const company = document.getElementById('contact-company').value;
      const phone = document.getElementById('contact-phone').value;
      const source = document.getElementById('contact-source').value;

      if (!email) {
        toast.error('Email is required');
        return;
      }

      try {
        const response = await fetch('/api/v1/crm/contacts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, first_name, last_name, company, phone, source })
        });

        if (!response.ok) {
          const data = await response.json();
          throw new Error(data.error || 'Failed to create contact');
        }

        toast.success('Contact created successfully');
        closeAddContactModal();
        loadContacts();
      } catch (err) {
        console.error('Create contact error:', err);
        toast.error(err.message);
      }
    }

    // Init
    checkAuth();
  </script>
</body>
</html>
