<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journey Builder - CRM - VillageMembers Admin</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/typography.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/crm.css">

  <style>
    .admin-layout { display: flex; min-height: 100vh; }
    .admin-main { flex: 1; margin-left: var(--sidebar-width); background-color: var(--bg-secondary); }
    @media (max-width: 768px) { .admin-main { margin-left: 0; padding-bottom: 4rem; } }

    /* Journey Builder Specific Styles */
    .journey-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: var(--space-6);
    }

    .pipeline-selector {
      background: var(--bg-primary);
      border: 2px solid var(--green-300);
      border-radius: var(--radius-xl);
      padding: var(--space-5);
      margin-bottom: var(--space-8);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pipeline-selector-left {
      display: flex;
      align-items: center;
      gap: var(--space-4);
    }

    .pipeline-dropdown {
      font-size: var(--text-2xl);
      font-weight: var(--font-bold);
      color: var(--text-primary);
      border: none;
      background: transparent;
      cursor: pointer;
      padding: var(--space-2);
    }

    .section-title {
      font-size: var(--text-2xl);
      font-weight: var(--font-bold);
      color: var(--text-primary);
      margin-bottom: var(--space-4);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    /* Stage Journey Flow */
    .journey-flow {
      background: var(--bg-primary);
      border-radius: var(--radius-xl);
      padding: var(--space-6);
      margin-bottom: var(--space-8);
      overflow-x: auto;
    }

    .stages-horizontal {
      display: flex;
      gap: var(--space-4);
      min-width: min-content;
      padding-bottom: var(--space-4);
    }

    .stage-card {
      min-width: 320px;
      background: var(--gray-50);
      border: 3px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: var(--space-5);
      position: relative;
      transition: all var(--transition-fast);
    }

    .stage-card:hover {
      border-color: var(--green-400);
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .stage-card-header {
      border-left: 6px solid;
      padding-left: var(--space-3);
      margin-bottom: var(--space-4);
    }

    .stage-name {
      font-size: var(--text-xl);
      font-weight: var(--font-bold);
      color: var(--text-primary);
      margin-bottom: var(--space-1);
    }

    .stage-description {
      font-size: var(--text-sm);
      color: var(--text-secondary);
    }

    .stage-stats {
      display: flex;
      gap: var(--space-4);
      margin-bottom: var(--space-4);
      padding: var(--space-3);
      background: white;
      border-radius: var(--radius-md);
    }

    .stage-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-1);
    }

    .stage-stat-value {
      font-size: var(--text-2xl);
      font-weight: var(--font-bold);
      color: var(--green-600);
    }

    .stage-stat-label {
      font-size: var(--text-xs);
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Substage Tree */
    .substages-container {
      margin-top: var(--space-3);
    }

    .substage-item {
      padding: var(--space-3);
      margin-left: var(--space-4);
      border-left: 2px solid var(--gray-300);
      margin-bottom: var(--space-2);
      transition: all var(--transition-fast);
    }

    .substage-item:hover {
      border-left-color: var(--green-500);
      background: var(--green-50);
      border-radius: var(--radius-md);
    }

    .substage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .substage-name {
      font-size: var(--text-base);
      font-weight: var(--font-semibold);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .substage-count {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      background: white;
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-md);
    }

    .substage-children {
      margin-top: var(--space-2);
    }

    .add-btn-inline {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      background: transparent;
      border: 2px dashed var(--gray-300);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      transition: all var(--transition-fast);
      width: 100%;
      justify-content: center;
      margin-top: var(--space-3);
    }

    .add-btn-inline:hover {
      border-color: var(--green-500);
      color: var(--green-600);
      background: var(--green-50);
    }

    /* Tags Section */
    .tags-section {
      background: var(--bg-primary);
      border-radius: var(--radius-xl);
      padding: var(--space-6);
    }

    .tags-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: var(--space-3);
      margin-top: var(--space-4);
    }

    .tag-card {
      background: var(--terra-50);
      border: 2px solid var(--terra-200);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all var(--transition-fast);
      cursor: pointer;
    }

    .tag-card:hover {
      border-color: var(--terra-500);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .tag-info {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .tag-icon {
      font-size: var(--text-xl);
    }

    .tag-name {
      font-weight: var(--font-semibold);
      color: var(--terra-700);
    }

    .tag-usage {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      background: white;
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-full);
    }

    .add-tag-card {
      background: transparent;
      border: 2px dashed var(--gray-300);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      color: var(--text-secondary);
      font-weight: var(--font-medium);
    }

    .add-tag-card:hover {
      border-color: var(--terra-500);
      color: var(--terra-600);
      background: var(--terra-50);
    }

    .arrow-connector {
      display: flex;
      align-items: center;
      color: var(--gray-400);
      font-size: var(--text-3xl);
      padding: 0 var(--space-2);
    }

    .empty-state {
      text-align: center;
      padding: var(--space-12);
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 4rem;
      margin-bottom: var(--space-4);
    }

    @media (max-width: 768px) {
      .stages-horizontal {
        flex-direction: column;
      }

      .arrow-connector {
        transform: rotate(90deg);
      }

      .journey-container {
        padding: var(--space-4);
      }
    }
  </style>
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar injected by navigation.js -->

    <!-- Main Content -->
    <main class="admin-main">
      <div class="crm-header">
        <div class="crm-header-title">🗺️ Journey Builder</div>
        <div class="crm-header-actions">
          <button onclick="openManagePipelinesModal()" class="btn btn-secondary btn-sm">Manage Pipelines</button>
        </div>
      </div>

      <div class="journey-container">
        <!-- Pipeline Selector -->
        <div class="pipeline-selector" id="pipeline-selector" style="display: none;">
          <div class="pipeline-selector-left">
            <div>
              <div style="font-size: var(--text-sm); color: var(--text-secondary); margin-bottom: var(--space-1);">Current Journey</div>
              <select id="pipeline-dropdown" class="pipeline-dropdown" onchange="handlePipelineChange()">
                <!-- Populated by JS -->
              </select>
            </div>
          </div>
          <button onclick="openEditPipelineModal()" class="btn btn-ghost btn-sm">⚙️ Edit Pipeline</button>
        </div>

        <!-- Loading State -->
        <div id="loading" class="crm-loading">Loading journey...</div>

        <!-- Journey Flow: Stages -->
        <div id="journey-content" style="display: none;">
          <div class="section-title">
            <span>📍 Journey Stages</span>
          </div>

          <div class="journey-flow">
            <div class="stages-horizontal" id="stages-container">
              <!-- Populated by JS -->
            </div>

            <button class="add-btn-inline" onclick="openAddStageModal()" style="max-width: 320px;">
              + Add Stage
            </button>
          </div>

          <!-- Tags Section -->
          <div class="section-title">
            <span>🏷️ Journey Tags</span>
          </div>

          <div class="tags-section">
            <div class="tags-grid" id="tags-container">
              <!-- Populated by JS -->
            </div>
          </div>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state" style="display: none;">
          <div class="empty-state-icon">🗺️</div>
          <h3>No pipelines yet</h3>
          <p>Create your first pipeline to start mapping your customer journey</p>
          <button onclick="openAddPipelineModal()" class="btn btn-primary" style="margin-top: var(--space-4);">Create First Pipeline</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Pipeline Modal -->
  <div id="pipeline-modal" class="crm-modal hidden">
    <div class="crm-modal-content">
      <div class="crm-modal-header">
        <h2 class="crm-modal-title" id="pipeline-modal-title">Create Pipeline</h2>
        <button class="crm-modal-close" onclick="closePipelineModal()">&times;</button>
      </div>
      <div class="crm-modal-body">
        <form id="pipeline-form">
          <div class="crm-form-group">
            <label class="crm-form-label">Pipeline Name *</label>
            <input type="text" id="pipeline-name" class="crm-form-input" required placeholder="e.g., Sales Pipeline">
          </div>
          <div class="crm-form-group">
            <label class="crm-form-label">Description</label>
            <textarea id="pipeline-description" class="crm-form-textarea" rows="3" placeholder="Describe this journey..."></textarea>
          </div>
          <div class="crm-form-group">
            <label class="crm-form-label">Color</label>
            <input type="color" id="pipeline-color" class="crm-form-input" value="#3D663D">
          </div>
        </form>
      </div>
      <div class="crm-modal-footer">
        <button class="btn btn-ghost" onclick="closePipelineModal()">Cancel</button>
        <button class="btn btn-primary" onclick="savePipeline()">Save Pipeline</button>
      </div>
    </div>
  </div>

  <!-- Add/Edit Stage Modal -->
  <div id="stage-modal" class="crm-modal hidden">
    <div class="crm-modal-content">
      <div class="crm-modal-header">
        <h2 class="crm-modal-title" id="stage-modal-title">Add Stage</h2>
        <button class="crm-modal-close" onclick="closeStageModal()">&times;</button>
      </div>
      <div class="crm-modal-body">
        <form id="stage-form">
          <div class="crm-form-group">
            <label class="crm-form-label">Stage Name *</label>
            <input type="text" id="stage-name" class="crm-form-input" required placeholder="e.g., New Lead">
          </div>
          <div class="crm-form-group">
            <label class="crm-form-label">Description</label>
            <textarea id="stage-description" class="crm-form-textarea" rows="2" placeholder="What happens at this stage..."></textarea>
          </div>
          <div class="crm-form-group">
            <label class="crm-form-label">Color</label>
            <input type="color" id="stage-color" class="crm-form-input" value="#6366f1">
          </div>
        </form>
      </div>
      <div class="crm-modal-footer">
        <button class="btn btn-ghost" onclick="closeStageModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveStage()">Save Stage</button>
      </div>
    </div>
  </div>

  <!-- Add/Edit Tag Modal -->
  <div id="tag-modal" class="crm-modal hidden">
    <div class="crm-modal-content">
      <div class="crm-modal-header">
        <h2 class="crm-modal-title" id="tag-modal-title">Create Tag</h2>
        <button class="crm-modal-close" onclick="closeTagModal()">&times;</button>
      </div>
      <div class="crm-modal-body">
        <form id="tag-form">
          <div class="crm-form-group">
            <label class="crm-form-label">Tag Name *</label>
            <input type="text" id="tag-name" class="crm-form-input" required placeholder="e.g., Hot Lead">
          </div>
          <div class="crm-form-group">
            <label class="crm-form-label">Description</label>
            <textarea id="tag-description" class="crm-form-textarea" rows="2" placeholder="When to use this tag..."></textarea>
          </div>
          <div class="crm-form-group">
            <label class="crm-form-label">Color</label>
            <input type="color" id="tag-color" class="crm-form-input" value="#C4653A">
          </div>
        </form>
      </div>
      <div class="crm-modal-footer">
        <button class="btn btn-ghost" onclick="closeTagModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveTag()">Save Tag</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/navigation.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let pipelines = [];
    let currentPipeline = null;
    let currentStages = [];
    let tags = [];
    let editingStageId = null;
    let editingSubstageParentId = null;

    // ========================================
    // INIT & AUTH
    // ========================================

    async function checkAuth() {
      try {
        const res = await fetch('/auth/me?type=user', { credentials: 'include' });
        if (!res.ok) { window.location.href = '/login.html'; return; }
        await loadPipelines();
      } catch (err) {
        window.location.href = '/login.html';
      }
    }

    // ========================================
    // LOAD DATA
    // ========================================

    async function loadPipelines() {
      try {
        const response = await fetch('/api/v1/crm/pipelines', { credentials: 'include' });
        if (!response.ok) throw new Error('Failed to load pipelines');
        const data = await response.json();
        pipelines = data.pipelines || [];

        document.getElementById('loading').style.display = 'none';

        if (pipelines.length === 0) {
          document.getElementById('empty-state').style.display = 'block';
          return;
        }

        // Show first pipeline by default
        currentPipeline = pipelines[0];
        renderPipelineSelector();
        await loadPipelineDetails(currentPipeline.id);

      } catch (err) {
        console.error('Load pipelines error:', err);
        toast.error('Failed to load pipelines');
      }
    }

    async function loadPipelineDetails(pipelineId) {
      try {
        const response = await fetch(`/api/v1/crm/pipelines/${pipelineId}`, { credentials: 'include' });
        if (!response.ok) throw new Error('Failed to load pipeline details');
        const data = await response.json();

        currentPipeline = data.pipeline;
        currentStages = data.stages || [];

        // Load tags
        await loadTags();

        renderJourney();

      } catch (err) {
        console.error('Load pipeline details error:', err);
        toast.error('Failed to load pipeline details');
      }
    }

    async function loadTags() {
      try {
        const response = await fetch('/api/v1/tags', { credentials: 'include' });
        if (!response.ok) throw new Error('Failed to load tags');
        const data = await response.json();
        tags = data.tags || [];
      } catch (err) {
        console.error('Load tags error:', err);
      }
    }

    // ========================================
    // RENDER
    // ========================================

    function renderPipelineSelector() {
      const dropdown = document.getElementById('pipeline-dropdown');
      dropdown.innerHTML = pipelines.map(p =>
        `<option value="${p.id}" ${p.id === currentPipeline?.id ? 'selected' : ''}>${p.name}</option>`
      ).join('');

      document.getElementById('pipeline-selector').style.display = 'flex';
    }

    function renderJourney() {
      document.getElementById('journey-content').style.display = 'block';
      renderStages();
      renderTags();
    }

    function renderStages() {
      const container = document.getElementById('stages-container');

      if (currentStages.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>No stages yet. Click "+ Add Stage" to create your first stage.</p></div>';
        return;
      }

      container.innerHTML = currentStages.map((stage, index) => {
        const arrow = index < currentStages.length - 1 ? '<div class="arrow-connector">→</div>' : '';
        return renderStageCard(stage) + arrow;
      }).join('');
    }

    function renderStageCard(stage) {
      const substagesHtml = stage.substages && stage.substages.length > 0
        ? `<div class="substages-container">
            ${stage.substages.map(sub => renderSubstage(sub, stage.id)).join('')}
            <button class="add-btn-inline" onclick="openAddSubstageModal('${stage.id}')">+ Add Substage</button>
          </div>`
        : `<button class="add-btn-inline" onclick="openAddSubstageModal('${stage.id}')">+ Add Substage</button>`;

      return `
        <div class="stage-card">
          <div class="stage-card-header" style="border-color: ${stage.color};">
            <div class="stage-name">${stage.name}</div>
            ${stage.description ? `<div class="stage-description">${stage.description}</div>` : ''}
          </div>

          <div class="stage-stats">
            <div class="stage-stat">
              <div class="stage-stat-value">${stage.contacts_count || 0}</div>
              <div class="stage-stat-label">Contacts</div>
            </div>
          </div>

          ${substagesHtml}

          <div style="display: flex; gap: var(--space-2); margin-top: var(--space-4);">
            <button class="btn btn-ghost btn-sm" onclick="editStage('${stage.id}')">Edit</button>
            <button class="btn btn-ghost btn-sm" onclick="deleteStage('${stage.id}')">Delete</button>
          </div>
        </div>
      `;
    }

    function renderSubstage(substage, parentId, depth = 1) {
      const indent = depth * 16;
      // For infinite depth, we'd recursively render children if they exist
      // Currently API only returns 1 level, but structure supports it
      return `
        <div class="substage-item" style="margin-left: ${indent}px;">
          <div class="substage-header">
            <div class="substage-name">
              <span>└</span>
              <span>${substage.name}</span>
            </div>
            <div style="display: flex; gap: var(--space-2); align-items: center;">
              <span class="substage-count">${substage.contacts_count || 0} contacts</span>
              <button class="btn btn-ghost btn-sm" onclick="editStage('${substage.id}')">Edit</button>
              <button class="btn btn-ghost btn-sm" onclick="deleteStage('${substage.id}')">Delete</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderTags() {
      const container = document.getElementById('tags-container');

      const tagsHtml = tags.map(tag => `
        <div class="tag-card" onclick="editTag('${tag.id}')">
          <div class="tag-info">
            <span class="tag-icon">🏷️</span>
            <span class="tag-name">${tag.name}</span>
          </div>
          <span class="tag-usage">${tag.usage_count || 0}</span>
        </div>
      `).join('');

      container.innerHTML = tagsHtml + `
        <div class="tag-card add-tag-card" onclick="openAddTagModal()">
          <span>+</span>
          <span>Add Tag</span>
        </div>
      `;
    }

    // ========================================
    // HANDLERS
    // ========================================

    async function handlePipelineChange() {
      const dropdown = document.getElementById('pipeline-dropdown');
      const pipelineId = dropdown.value;
      await loadPipelineDetails(pipelineId);
    }

    // Pipeline CRUD
    function openAddPipelineModal() {
      document.getElementById('pipeline-modal-title').textContent = 'Create Pipeline';
      document.getElementById('pipeline-form').reset();
      document.getElementById('pipeline-modal').classList.remove('hidden');
    }

    function openEditPipelineModal() {
      if (!currentPipeline) return;
      document.getElementById('pipeline-modal-title').textContent = 'Edit Pipeline';
      document.getElementById('pipeline-name').value = currentPipeline.name;
      document.getElementById('pipeline-description').value = currentPipeline.description || '';
      document.getElementById('pipeline-color').value = currentPipeline.color || '#3D663D';
      document.getElementById('pipeline-modal').classList.remove('hidden');
    }

    function closePipelineModal() {
      document.getElementById('pipeline-modal').classList.add('hidden');
    }

    async function savePipeline() {
      const name = document.getElementById('pipeline-name').value;
      const description = document.getElementById('pipeline-description').value;
      const color = document.getElementById('pipeline-color').value;

      if (!name) {
        toast.error('Pipeline name is required');
        return;
      }

      try {
        const url = currentPipeline && document.getElementById('pipeline-modal-title').textContent.includes('Edit')
          ? `/api/v1/crm/pipelines/${currentPipeline.id}`
          : '/api/v1/crm/pipelines';

        const method = url.includes(currentPipeline?.id) ? 'PUT' : 'POST';

        const response = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ name, description, color })
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Failed to save pipeline');
        }

        toast.success('Pipeline saved');
        closePipelineModal();
        await loadPipelines();

      } catch (err) {
        console.error('Save pipeline error:', err);
        toast.error(err.message);
      }
    }

    // Stage CRUD
    function openAddStageModal() {
      editingStageId = null;
      editingSubstageParentId = null;
      document.getElementById('stage-modal-title').textContent = 'Add Stage';
      document.getElementById('stage-form').reset();
      document.getElementById('stage-modal').classList.remove('hidden');
    }

    function openAddSubstageModal(parentStageId) {
      editingStageId = null;
      editingSubstageParentId = parentStageId;
      document.getElementById('stage-modal-title').textContent = 'Add Substage';
      document.getElementById('stage-form').reset();
      document.getElementById('stage-modal').classList.remove('hidden');
    }

    function editStage(stageId) {
      editingStageId = stageId;
      editingSubstageParentId = null;
      // Find stage in current stages or substages
      let stage = currentStages.find(s => s.id === stageId);
      if (!stage) {
        // Check substages
        for (let s of currentStages) {
          if (s.substages) {
            stage = s.substages.find(sub => sub.id === stageId);
            if (stage) break;
          }
        }
      }

      if (!stage) return;

      document.getElementById('stage-modal-title').textContent = 'Edit Stage';
      document.getElementById('stage-name').value = stage.name;
      document.getElementById('stage-description').value = stage.description || '';
      document.getElementById('stage-color').value = stage.color || '#6366f1';
      document.getElementById('stage-modal').classList.remove('hidden');
    }

    function closeStageModal() {
      document.getElementById('stage-modal').classList.add('hidden');
    }

    async function saveStage() {
      const name = document.getElementById('stage-name').value;
      const description = document.getElementById('stage-description').value;
      const color = document.getElementById('stage-color').value;

      if (!name) {
        toast.error('Stage name is required');
        return;
      }

      try {
        let url, method, body;

        if (editingStageId) {
          // Update existing stage
          url = `/api/v1/crm/pipelines/${currentPipeline.id}/stages/${editingStageId}`;
          method = 'PUT';
          body = { name, description, color };
        } else {
          // Create new stage or substage
          url = `/api/v1/crm/pipelines/${currentPipeline.id}/stages`;
          method = 'POST';
          body = {
            name,
            description,
            color,
            parent_stage_id: editingSubstageParentId || null
          };
        }

        const response = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(body)
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Failed to save stage');
        }

        toast.success('Stage saved');
        closeStageModal();
        await loadPipelineDetails(currentPipeline.id);

      } catch (err) {
        console.error('Save stage error:', err);
        toast.error(err.message);
      }
    }

    async function deleteStage(stageId) {
      if (!confirm('Are you sure you want to delete this stage?')) return;

      try {
        const response = await fetch(`/api/v1/crm/pipelines/${currentPipeline.id}/stages/${stageId}`, {
          method: 'DELETE',
          credentials: 'include'
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Failed to delete stage');
        }

        toast.success('Stage deleted');
        await loadPipelineDetails(currentPipeline.id);

      } catch (err) {
        console.error('Delete stage error:', err);
        toast.error(err.message);
      }
    }

    // Tag CRUD
    function openAddTagModal() {
      document.getElementById('tag-modal-title').textContent = 'Create Tag';
      document.getElementById('tag-form').reset();
      document.getElementById('tag-modal').classList.remove('hidden');
    }

    function editTag(tagId) {
      const tag = tags.find(t => t.id === tagId);
      if (!tag) return;

      document.getElementById('tag-modal-title').textContent = 'Edit Tag';
      document.getElementById('tag-name').value = tag.name;
      document.getElementById('tag-description').value = tag.description || '';
      document.getElementById('tag-color').value = tag.color || '#C4653A';
      document.getElementById('tag-modal').classList.remove('hidden');
    }

    function closeTagModal() {
      document.getElementById('tag-modal').classList.add('hidden');
    }

    async function saveTag() {
      const name = document.getElementById('tag-name').value;
      const description = document.getElementById('tag-description').value;
      const color = document.getElementById('tag-color').value;

      if (!name) {
        toast.error('Tag name is required');
        return;
      }

      try {
        const method = document.getElementById('tag-modal-title').textContent.includes('Edit') ? 'PUT' : 'POST';
        const url = '/api/v1/tags';

        const response = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ name, description, color })
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Failed to save tag');
        }

        toast.success('Tag saved');
        closeTagModal();
        await loadTags();
        renderTags();

      } catch (err) {
        console.error('Save tag error:', err);
        toast.error(err.message);
      }
    }

    function openManagePipelinesModal() {
      // TODO: Implement pipeline management modal with list/edit/delete
      toast.info('Pipeline management coming soon');
    }

    // Init
    checkAuth();
  </script>
</body>
</html>
